name: fleetupdate

services:
  db:
    image: postgres:16-alpine
    container_name: fleetupdate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetupdate}
      POSTGRES_USER: ${POSTGRES_USER:-fleet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_secure_db_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet_user} -d ${POSTGRES_DB:-fleetupdate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/rivolte-hl/fleetupdate-backend:${TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetupdate-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-fleet_user}:${POSTGRES_PASSWORD:-fleet_secure_db_pass_2026}@db:5432/${POSTGRES_DB:-fleetupdate}?schema=public}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000,https://fleetupdate.example.com}"
    volumes:
      - ssh_keys:/app/keys
    networks:
      - internal-net
      - mgmt-net
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/rivolte-hl/fleetupdate-frontend:${TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fleetupdate-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - internal-net
      - mgmt-net

volumes:
  postgres_data:
    driver: local
  ssh_keys:
    driver: local

networks:
  internal-net:
    internal: true
    driver: bridge
  mgmt-net:
    driver: bridge
