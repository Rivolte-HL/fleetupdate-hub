# Gitleaks Configuration for FleetUpdate-Hub
title = "FleetUpdate-Hub Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Allowed mock keys and documentation examples"
paths = [
  '''backend/src/tests/.*''',
  '''\.env\.example''',
  '''scripts/generate-secrets\..*'''
]
regexes = [
  '''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
  '''super_secret_jwt_key_at_least_32_characters_long''',
  '''MOCK_TEST_KEY_DO_NOT_USE_IN_PROD'''
]
